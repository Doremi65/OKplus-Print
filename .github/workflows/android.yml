name: Build OKPLUS XPrinter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OKPLUS_XPrinter_Android_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet Android
        run: |
          mkdir android-source
          unzip -o OKPLUS_XPrinter_Android_Source.zip \
            -d android-source

      - name: Compiler APK
        run: |
          cd android-source
          gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: OKPLUS-XPrinter-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 
